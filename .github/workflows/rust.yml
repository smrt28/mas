name: Rust
on: [push, pull_request]
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: python3 tools/generate_shared_key.py
      - run: cargo fmt --check
      - run: cargo test --locked --no-default-features --features network-tests
      - run: cargo clippy --locked --no-default-features --all-targets -- -D warnings
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev libx11-dev libxi-dev libxrandr-dev
      - run: python3 tools/generate_shared_key.py
      - run: cargo build --locked --bin mas-client
      - run: cargo test --locked --features network-tests --bin mas-client
  windows-client:
    runs-on: windows-latest
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Disposable CI key only; distribution builds use the server's shared key.
      - run: python tools/generate_shared_key.py
      - run: cargo build --locked --release --no-default-features --features client --bin mas-client
      - run: cargo test --locked --release --bin mas-client
