name: Rust
on: [push, pull_request]
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: python3 tools/generate_shared_key.py
      - run: cargo fmt --check
      - run: python3 tests/build_mac_client.py
      - run: cargo test --locked --no-default-features --features network-tests
      - run: cargo clippy --locked --no-default-features --all-targets -- -D warnings
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev libx11-dev libxi-dev libxrandr-dev
      - run: python3 tools/generate_shared_key.py
      - run: cargo build --locked --bin mas-client
      - run: cargo test --locked --features network-tests --bin mas-client
  ai-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: python3 tools/generate_shared_key.py
      - run: cargo build --locked --release --no-default-features --features ai-client --bin mas-ai-client
      - run: cargo test --locked --no-default-features --features ai-client,network-tests
      - run: cargo clippy --locked --no-default-features --features ai-client --all-targets -- -D warnings
  mac-client:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Disposable CI key only; distribution builds use the server's shared key.
      - run: python3 tools/generate_shared_key.py
      - run: ./tools/build_mac_client.sh
      - name: Verify Apple Silicon bundle
        run: |
          lipo -verify_arch arm64 target/mac/mas-client
          codesign --verify --strict "target/mac/Marsal a spion.app"
          if [[ "$(uname -m)" == arm64 ]]; then
            ./target/mac/mas-client --licenses
            cargo test --locked --target aarch64-apple-darwin --no-default-features --features client --bin mas-client
          fi
  windows-client:
    runs-on: windows-latest
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Disposable CI key only; distribution builds use the server's shared key.
      - run: python tools/generate_shared_key.py
      - run: cargo build --locked --release --no-default-features --features client --bin mas-client
      - run: cargo test --locked --release --bin mas-client
