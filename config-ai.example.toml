# Copy to config-ai.toml (ignored by Git) and supply your API key locally.
hostname = "127.0.0.1"
port = 4000
game = "AI match"
openai_api_key = "REPLACE_WITH_YOUR_OPENAI_API_KEY"
model = "gpt-4.1-mini"
# OpenAI output limit includes internal reasoning tokens. Range: 64..32768.
max_output_tokens = 4096
# GPT-6 defaults to low reasoning; override only for a model that supports it.
# reasoning_effort = "low"

# Set the top-level model = "local" to select this provider.
# baseUrl includes the API prefix; /chat/completions is appended automatically.
# openai_api_key can be omitted when model = "local".
[local]
baseUrl = "http://localhost:8000/v1"
apiKey = "REPLACE_WITH_YOUR_LOCAL_API_KEY" # Empty string for a server without auth.
model = "recommended-coder" # Actual model ID served by the private provider.
timeoutSeconds = 180 # Total local request deadline, including response generation (1..3600).
